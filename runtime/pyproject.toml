[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-bot-runtime"
version = "0.1.0"
description = "Durable single-owner personal agent runtime"
license = {file = "LICENSE"}
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "httpx>=0.28,<1",
  "cryptography>=44", "langgraph>=1,<2", "croniter>=6,<7",
  "python-multipart>=0.0.20", "pydantic>=2.10,<3", "jsonschema>=4.23",
  "playwright>=1.49", "websockets>=14", "pypdf>=5", "python-docx>=1.1",
  "openpyxl>=3.1", "reportlab>=4", "pillow>=11"
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.25"]

[tool.setuptools.packages.find]
include = ["personal_bot*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
